name: Rollout CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # JOB 1: Backend CI (Validation & Linting)
  # ==========================================
  backend-ci:
    name: Backend Check (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Server Syntax
        working-directory: ./server
        run: node --check index.js

  # ==========================================
  # JOB 2: Frontend CI (Vite Production Build)
  # ==========================================
  frontend-ci:
    name: Frontend Build (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build React Frontend
        working-directory: ./client
        run: npm run build

  # ==========================================
  # JOB 3: Continuous Deployment (CD - Optional)
  # ==========================================
  deploy:
    name: Deploy to Production
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Verify All Checks Passed
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "🚀 Code is verified and ready for deployment."

      # Optional Render Deployment (Uncomment when you have a Render Deploy Hook URL)
      # - name: Trigger Render Deploy Hook
      #   if: env.RENDER_DEPLOY_HOOK_URL != ''
      #   env:
      #     RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      #   run: |
      #     curl -X POST "$RENDER_DEPLOY_HOOK_URL"
